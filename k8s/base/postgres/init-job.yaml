apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-dbs
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-dbs
          image: postgres:17-alpine
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready; do sleep 1; done
              for db in library profile kratos hydra; do
                psql -tc "SELECT 1 FROM pg_database WHERE datname = '${db}'" | grep -q 1 \
                  || psql -c "CREATE DATABASE \"${db}\""
              done
