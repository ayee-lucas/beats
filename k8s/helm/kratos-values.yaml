# Local development values for the Ory Kratos Helm chart.
#
# This is intentionally insecure: fixed secrets, development mode, and no real
# SMTP provider. Do NOT use these values in production.
#
# Install:
#   make helm-repo
#   tilt up
#
# Reference: https://github.com/ory/k8s/blob/master/docs/helm/kratos.md

kratos:
  development: true

  automigration:
    enabled: true

  config:
    # Reuses the shared Postgres deployed by k8s/base/postgres.
    dsn: postgres://postgres:postgres@postgres:5432/kratos?sslmode=disable

    # Insecure, deterministic secrets for local development only.
    # Rotate these before deploying to any real environment.
    secrets:
      default:
        - local-development-default-secret-do-not-use-in-production
      cookie:
        - local-development-cookie-secret-do-not-use-in-production

    identity:
      default_schema_id: default
      schemas:
        - id: default
          # Mounted from the kratos-identity-schema ConfigMap.
          url: file:///etc/config/schemas/identity.default.schema.json

    # Placeholder return URL. Browser flows are not wired up locally yet.
    selfservice:
      default_browser_return_url: http://127.0.0.1:4455/

    # Dummy SMTP URI. Email verification/recovery flows are disabled below.
    courier:
      smtp:
        connection_uri: smtps://test:test@localhost:1025/?skip_ssl_verify=true

# Mount the identity schema ConfigMap deployed by k8s/base/kratos.
deployment:
  extraVolumes:
    - name: identity-schema
      configMap:
        name: kratos-identity-schema
  extraVolumeMounts:
    - name: identity-schema
      mountPath: /etc/config/schemas
      readOnly: true
